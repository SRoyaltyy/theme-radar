name: Finviz Score Delta

on:
  schedule:
    # After the Finviz snapshot, DST-safe (scripts/schedule_gate.py): runs in
    # the first slot where today's post-close snapshot is in and today is not
    # scored yet; the other slot is a no-op.
    #   21:00 UTC (summer, finviz 20:30)  |  22:00 UTC (winter, finviz 21:30)
    - cron: "0 21 * * 1-5"
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Snapshot date YYYY-MM-DD (default: manifest latest)"
        required: false
        default: ""
      trace_tickers:
        description: "Optional tickers for full audit (e.g. MP,OKLO)"
        required: false
        default: ""
      trace_horizon:
        description: "1d / 1w / 1m"
        required: false
        default: "1d"

permissions:
  contents: write

concurrency:
  group: score-delta
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Gate (trading day, today's post-close snapshot in, not yet scored)
        id: gate
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "manual run_date set -> proceed"; echo "trading=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/schedule_gate.py score --event "${{ github.event_name }}"
          fi

      - name: Resolve target date
        if: steps.gate.outputs.trading == 'true'
        id: date
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "date=${{ github.event.inputs.run_date }}" >> "$GITHUB_OUTPUT"
          elif [ -f data/snapshots/manifest.json ]; then
            LATEST=$(python -c "import json; print(json.load(open('data/snapshots/manifest.json')).get('latest',''))")
            echo "date=${LATEST:-$(TZ=America/New_York date +%F)}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify past history unchanged (hash manifest)
        if: steps.gate.outputs.trading == 'true'
        run: python scripts/check_history_hashes.py verify

      - name: Score + full-universe feature log
        if: steps.gate.outputs.trading == 'true'
        run: |
          set -e
          DATE="${{ steps.date.outputs.date }}"
          TRACE="${{ github.event.inputs.trace_tickers }}"
          HORIZON="${{ github.event.inputs.trace_horizon }}"
          HORIZON="${HORIZON:-1d}"
          TODAY="$(TZ=America/New_York date +%F)"
          if [[ "$DATE" < "$TODAY" ]] && { [ -f "data/features/${DATE}_1d.csv" ] || \
               [ -f "data/scores/${DATE}_1d.csv" ] || [ -f "01_daily/${DATE}_scan.md" ]; }; then
            echo "[history] $DATE < $TODAY already scored — not re-scoring a past day (append-only)."
            exit 0
          fi
          echo "=== score_engine --date $DATE ==="
          if [ -n "$TRACE" ]; then
            python -m src.score_engine --date "$DATE" --trace "$TRACE" --horizon "$HORIZON"
          else
            python -m src.score_engine --date "$DATE"
          fi

      - name: Universe deep labeling (segment membership + stats)
        if: steps.gate.outputs.trading == 'true'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          python -m src.segments ${DATE:+--date "$DATE"}

      - name: Check dated files (only today's may be replaced)
        if: steps.gate.outputs.trading == 'true'
        run: python scripts/check_history_hashes.py add-new --today "$(TZ=America/New_York date +%F)"

      - name: Backfill forward labels (all scan dates with later snapshots)
        if: steps.gate.outputs.trading == 'true'
        run: python -m src.label_backfill

      - name: Attribution (full universe IC / combos / risk)
        if: steps.gate.outputs.trading == 'true'
        run: python -m src.attribution

      - name: Aggregate factor report + weight learning
        if: steps.gate.outputs.trading == 'true'
        run: |
          python -m src.attribution_aggregate
          python -m src.weight_learner

      - name: Check labels / attribution (fill-once, append-only)
        if: steps.gate.outputs.trading == 'true'
        run: python scripts/check_history_hashes.py add-new --today "$(TZ=America/New_York date +%F)"

      - name: Print brief + attribution to log
        if: steps.gate.outputs.trading == 'true'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          for f in 01_daily/${DATE}_scan.md 01_daily/${DATE}_attribution.md; do
            [ -f "$f" ] && echo "======== $f ========" && cat "$f"
          done
          ls -la data/features/ data/labels/ data/scores/ data/attribution/ 2>/dev/null || true

      - name: Commit all research outputs
        if: steps.gate.outputs.trading == 'true'
        run: |
          git config user.name "Theme-Radar-Bot"
          git config user.email "bot@users.noreply.github.com"
          # Labels are fill-once, attribution pointers upgrade-only, past-dated
          # files write-once; manifests are recorded after rebasing onto main.
          bash scripts/commit_with_history.sh \
            "auto: score+features+labels+attr ${{ steps.date.outputs.date }}" \
            "$(TZ=America/New_York date +%F)" \
            data/scores data/features data/labels data/attribution data/universe \
            data/weight_overrides.json 01_daily 02_lessons 03_scoreboard
