name: Factor Backtest

on:
  workflow_dispatch:
    inputs:
      scan_date:
        description: >
          Signal as-of date (YYYY-MM-DD). Leave empty to backfill+attribute+suggestion-check
          ALL feature dates that have later snapshots.
        required: false
        default: ""
      ensure_features:
        description: "If true, run score_engine first so features exist for scan_date"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify past history unchanged (hash manifest)
        run: python scripts/check_history_hashes.py verify

      - name: Show available snapshots / features
        run: |
          echo "=== snapshots ==="
          ls -la data/snapshots/*.csv 2>/dev/null | head -30 || true
          echo "=== features ==="
          ls -la data/features/ 2>/dev/null || true
          echo "=== labels ==="
          ls -la data/labels/ 2>/dev/null || true

      - name: Ensure features (score_engine) for scan_date
        if: ${{ github.event.inputs.ensure_features == 'true' && github.event.inputs.scan_date != '' }}
        run: |
          set -e
          DATE="${{ github.event.inputs.scan_date }}"
          TODAY="$(TZ=America/New_York date +%F)"
          # Append-only + one-day-at-a-time: backtest never scores a past day.
          # score_engine uses the CURRENT weight_overrides.json (learned from
          # later labels), so building day N later would leak days > N.
          # Only today's (ET) snapshot may be (re)scored here.
          if [[ "$DATE" != "$TODAY" ]]; then
            echo "[history] $DATE != today $TODAY — skip score_engine (past days are never re-scored or back-built)"
          else
            python -m src.score_engine --date "$DATE"
          fi

      - name: Ensure features for all dated snapshots (no scan_date)
        if: ${{ github.event.inputs.ensure_features == 'true' && github.event.inputs.scan_date == '' }}
        run: |
          set -e
          python - <<'PY'
          # One day at a time, today only: past snapshot dates are never scored
          # after the fact (current weights would leak later labels into them).
          import subprocess, sys
          from pathlib import Path
          from src.snapshots import snapshot_dates
          from src.trading_calendar import today_et
          d = today_et().isoformat()
          dates = snapshot_dates()
          missing_past = [x for x in sorted(dates) if x < d
                          and not Path(f"data/features/{x}_1d.csv").exists()]
          if missing_past:
              print(f"[history] past dates without features are NOT back-built: {missing_past}")
          if d not in dates:
              print(f"[skip score] no snapshot for today {d}")
              raise SystemExit(0)
          print(f"[run] score_engine --date {d}")
          r = subprocess.run([sys.executable, "-m", "src.score_engine", "--date", d])
          raise SystemExit(r.returncode)
          PY

      - name: Label backfill (forward returns after signal)
        run: |
          set -e
          DATE="${{ github.event.inputs.scan_date }}"
          if [ -n "$DATE" ]; then
            python -m src.label_backfill --scan-date "$DATE"
          else
            python -m src.label_backfill
          fi

      - name: Attribution (full-universe IC / combos / risk)
        run: |
          set -e
          DATE="${{ github.event.inputs.scan_date }}"
          if [ -n "$DATE" ]; then
            python -m src.attribution --scan-date "$DATE"
          else
            python -m src.attribution
          fi

      - name: Suggestion check (full universe accuracy)
        run: |
          set -e
          DATE="${{ github.event.inputs.scan_date }}"
          if [ -n "$DATE" ]; then
            python -m src.suggestion_check --scan-date "$DATE"
          else
            python -m src.suggestion_check
          fi

      - name: Aggregate factor report + weight learning
        run: |
          python -m src.attribution_aggregate
          python -m src.weight_learner

      - name: Predictive audit (accuracy + factors + combos)
        run: |
          python -m src.predictive_audit --horizon 1d
          python -m src.predictive_audit --horizon 2d || true
          python -m src.predictive_audit --horizon 3d || true

      - name: Print results to log
        run: |
          DATE="${{ github.event.inputs.scan_date }}"
          if [ -n "$DATE" ]; then
            for f in 01_daily/${DATE}_suggestion_check.md data/attribution/${DATE}_suggestion_check.csv; do
              [ -f "$f" ] && echo "======== $f ========" && head -80 "$f"
            done
          else
            for f in 01_daily/_suggestion_check_BOARD.md 03_scoreboard/predictive_audit.md 03_scoreboard/factor_report.md; do
              [ -f "$f" ] && echo "======== $f ========" && cat "$f"
            done
          fi

      - name: Commit backtest outputs
        run: |
          git config user.name "Theme-Radar-Bot"
          git config user.email "bot@users.noreply.github.com"
          MSG="auto: backtest ${{ github.event.inputs.scan_date }}"
          [ -z "${{ github.event.inputs.scan_date }}" ] && MSG="auto: backtest all eligible dates"
          # add-new runs on the rebased tree: fails (no push) if any past-dated
          # record changed; only today's files may be replaced.
          bash scripts/commit_with_history.sh "$MSG" "$(TZ=America/New_York date +%F)" \
            data/features data/scores data/labels data/attribution \
            data/weight_overrides.json 01_daily 02_lessons 03_scoreboard
