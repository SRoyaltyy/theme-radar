name: Finviz Daily Snapshot

on:
  schedule:
    # After US cash close, DST-safe (scripts/schedule_gate.py picks one slot):
    #   20:30 UTC = 16:30 EDT (summer)  |  21:30 UTC = 16:30 EST (winter)
    # The other slot is a no-op (pre-close, or today's snapshot already in).
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finviz-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pandas

      - name: Gate (trading day, after 16:00 ET close, not already fetched)
        id: gate
        run: python scripts/schedule_gate.py finviz --event "${{ github.event_name }}"

      - name: Verify past history unchanged (hash manifest)
        if: steps.gate.outputs.trading == 'true'
        run: python scripts/check_history_hashes.py verify

      - name: Fetch Finviz Elite export
        if: steps.gate.outputs.trading == 'true'
        env:
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
          FINVIZ_EXPORT_URL: ${{ secrets.FINVIZ_EXPORT_URL }}
          FINVIZ_API_KEY: ${{ secrets.FINVIZ_API_KEY }}
        run: python -m src.finviz_fetch

      - name: Record hashes for new dated files
        if: steps.gate.outputs.trading == 'true'
        run: python scripts/check_history_hashes.py add-new --today "${{ steps.gate.outputs.et_date }}"

      - name: Commit snapshot
        if: steps.gate.outputs.trading == 'true'
        run: |
          git config user.name "Theme-Radar-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots/
          git commit -m "auto: finviz snapshot ${{ steps.gate.outputs.et_date }}" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
