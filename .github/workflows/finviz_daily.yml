name: Finviz Daily Snapshot

on:
  schedule:
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pandas

      - name: Fetch Finviz Elite export
        env:
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
          FINVIZ_EXPORT_URL: ${{ secrets.FINVIZ_EXPORT_URL }}
          FINVIZ_API_KEY: ${{ secrets.FINVIZ_API_KEY }}
        run: python -m src.finviz_fetch

      - name: Commit snapshot
        run: |
          git config user.name "Theme-Radar-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots/
          git commit -m "auto: finviz snapshot $(date -u +%F)" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
